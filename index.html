<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeple Club</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@600&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src='./script.js' defer></script>
</head>
<body>
    <header class='header'>
        <a href="#start" class='header__link'>
            <img src="./images/meeple-logo.svg" alt="" class='header__link-logo'>
            Meeple Club
        </a>
        <nav class='header__navigation'>
            <a href="#spotkania">Spotkania</a>
            <a href="#gry">Gry</a>
            <a href="#galeria">Galeria</a>
            <a href="#faq">FAQ</a>
        </nav>
        <a href="#dolacz" class='btn'>
            Dołącz
        </a>
    </header>
    <main>
        <section id='start' class='section-start'>
            <div class="section-start__info">
                <p class='section-start__info-addr'>Co czwartek / 18:00 / Łódź / ul. Kostki 6</p>
                <h1 class='section-start__title'>Rzuć kością. <br> Zostań <br> <span>na wieczór</span></h1>
                <p class='section-start__info-description'>Ponad 200 gier na półkach, ludzie, którzy chętnie wytłumaczą zasady, i herbata za darmo. Wpadnij — nie musisz nic umieć.</p>
                <div class="section-start__info-btns">
                    <a href="#spotkania" class='btn'>Najbliższe spotkania</a>
                    <a href="#gry" class='btn btn_primary'>Przeglądaj gry</a>
                </div>
            </div>
            <div class="section-start__assets">
                <img src="./images/dice-1.svg" alt="">
                <img src="./images/dice-3.svg" alt="">
                <img src="./images/card.svg" alt="">
                <img src="./images/meeple-cream.svg" alt="">
                <img src="./images/hex-tile.svg" alt="">
                <img src="./images/meeple-sky.svg" alt="">
            </div>
        </section>
    </main>
</body>
</html>
